name: iOS build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_llm:
        description: "實際呼叫 DeepSeek／Claude／Ollama Cloud／ElevenLabs（需對應的 repo secret；只用虛構逐字稿與合成語音）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax & CER smoke test
        run: |
          python3 -m py_compile bench/cer.py bench/elevenlabs_stt.py
          printf '今天我們討論，預算。' > /tmp/r.txt
          printf '今天我們討論預算' > /tmp/h.txt
          python3 bench/cer.py /tmp/r.txt /tmp/h.txt --json | grep '"rate": 0.0'

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]['udid'] if c else '')")
          test -n "$UDID" || { xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        working-directory: app
        env:
          # 只有手動觸發且勾選 live_llm 才提供金鑰；push / pull_request 一律不帶（LiveLLMTests 會略過）。
          # xcodebuild 會把 TEST_RUNNER_ 開頭的變數去掉前綴後傳給測試程序。
          TEST_RUNNER_DEEPSEEK_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_llm) && secrets.DEEPSEEK_API_KEY || '' }}
          TEST_RUNNER_ANTHROPIC_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_llm) && secrets.ANTHROPIC_API_KEY || '' }}
          TEST_RUNNER_OLLAMA_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_llm) && secrets.OLLAMA_API_KEY || '' }}
          TEST_RUNNER_ELEVENLABS_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.live_llm) && secrets.ELEVENLABS_API_KEY || '' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project PlaudNotes.xcodeproj \
            -scheme PlaudNotes \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E 'error:|warning: .*Sendable|Test Suite|Executed|BUILD|\*\* |LIVE|skipped' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' build.log
      - name: Check sample .docx with macOS textutil
        # DocxExporterTests 會在模擬器的暫存資料夾寫出範例檔；用 macOS 內建的 docx 讀取器再讀一次
        run: |
          set -euo pipefail
          F=$(find ~/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }} -name 'plaudnotes-docx-sample.docx' -print -quit)
          test -n "$F" || { echo "找不到範例 .docx"; exit 1; }
          cp "$F" docx-sample.docx
          python3 -c "import zipfile; z = zipfile.ZipFile('docx-sample.docx'); assert z.testzip() is None; print(z.namelist())"
          textutil -convert txt -encoding UTF-8 -stdout docx-sample.docx | tee docx-sample.txt
          for s in '會議記錄：A & B <C> 合作案' '寄出報價' '未提及' '日本語テキスト' '由 test-model 產生。'; do
            grep -qF "$s" docx-sample.txt || { echo "textutil 輸出缺少：$s"; exit 1; }
          done
      - name: Upload sample .docx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-sample
          path: docx-sample.docx
          if-no-files-found: ignore
      - name: Upload live LLM log
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_llm
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-log
          path: app/build.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/build.log
