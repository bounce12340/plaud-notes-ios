name: PlaudNotes
options:
  bundleIdPrefix: com.example.plaudnotes   # 改成自己的反向網域
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""                     # 在 Xcode 裡選自己的 Team
    CODE_SIGN_STYLE: Automatic
targets:
  PlaudNotes:
    type: application
    platform: iOS
    sources:
      - path: PlaudNotes
        excludes: ["Resources/OpenCC/**"]
      # 資料夾參照：打包後保留 OpenCC/ 子資料夾（字典與授權檔）
      - path: PlaudNotes/Resources/OpenCC
        type: folder
    scheme:
      testTargets: [PlaudNotesTests]
    info:
      path: PlaudNotes/Info.plist
      properties:
        CFBundleDisplayName: Plaud Notes
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 用來錄製會議、訪談或講座，錄音只存在這台裝置上。
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # 允許連到區網的自架 LLM（例如 http://mac-mini.local:11434）；網際網路仍強制 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用來連線到你在區域網路上自架的 AI 模型（例如 Mac mini 上的 Ollama）。
  PlaudNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlaudNotesTests]
    dependencies:
      - target: PlaudNotes
    settings:
      base:
        # CI 以 ad-hoc 簽章建置時，測試 bundle 也需要 Info.plist
        GENERATE_INFOPLIST_FILE: YES
