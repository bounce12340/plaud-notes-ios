name: PlaudNotes
options:
  bundleIdPrefix: com.example.plaudnotes   # 改成自己的反向網域
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""                     # 在 Xcode 裡選自己的 Team
    CODE_SIGN_STYLE: Automatic
    # App 與 Share Extension 交換檔案用的 App Group；改 Bundle ID 時一起改（需付費開發者帳號）
    APP_GROUP_ID: group.com.example.plaudnotes.PlaudNotes
targets:
  PlaudNotes:
    type: application
    platform: iOS
    sources:
      - path: PlaudNotes
        excludes: ["Resources/OpenCC/**"]
      # 與 Widget Extension 共用（即時動態的資料型別與停止按鈕）
      - path: Shared
      # 資料夾參照：打包後保留 OpenCC/ 子資料夾（字典與授權檔）
      - path: PlaudNotes/Resources/OpenCC
        type: folder
    dependencies:
      - target: PlaudNotesWidgets
      - target: PlaudNotesShare
    entitlements:
      path: PlaudNotes/PlaudNotes.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    scheme:
      testTargets: [PlaudNotesTests]
    info:
      path: PlaudNotes/Info.plist
      properties:
        CFBundleDisplayName: Plaud Notes
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 用來錄製會議、訪談或講座，錄音只存在這台裝置上。
        UIBackgroundModes: [audio]
        # 錄音中在鎖定畫面與動態島顯示時間與停止按鈕
        NSSupportsLiveActivities: true
        PlaudNotesAppGroup: $(APP_GROUP_ID)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # 允許連到區網的自架 LLM（例如 http://mac-mini.local:11434）；網際網路仍強制 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用來連線到你在區域網路上自架的 AI 模型（例如 Mac mini 上的 Ollama）。
  PlaudNotesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PlaudNotesWidgets
      - path: Shared
    info:
      path: PlaudNotesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Plaud Notes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # 必須以 App 的 Bundle ID 開頭；改 App 的 Bundle ID 時要一起改
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plaudnotes.PlaudNotes.Widgets
  PlaudNotesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PlaudNotesShare
      - path: Shared/SharedInbox.swift
    entitlements:
      path: PlaudNotesShare/PlaudNotesShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: PlaudNotesShare/Info.plist
      properties:
        CFBundleDisplayName: Plaud Notes
        PlaudNotesAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 只在分享內容含音檔時出現（語音備忘錄、檔案 App、郵件附件等）
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att,
              ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count >= 1).@count >= 1
    settings:
      base:
        # 必須以 App 的 Bundle ID 開頭；改 App 的 Bundle ID 時要一起改
        PRODUCT_BUNDLE_IDENTIFIER: com.example.plaudnotes.PlaudNotes.Share
  PlaudNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlaudNotesTests]
    dependencies:
      - target: PlaudNotes
    settings:
      base:
        # CI 以 ad-hoc 簽章建置時，測試 bundle 也需要 Info.plist
        GENERATE_INFOPLIST_FILE: YES
